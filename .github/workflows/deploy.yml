name: Deploy ReCode

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# The target server is kept out of the repo: set the repository secrets
# SERVER_HOST and SERVER_USER (plus SSH_PRIVATE_KEY) to enable deploys
env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  DEPLOY_PATH: /home/recode
  SERVICE: recode
  APP_PORT: "3200"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # An out-of-date client silently ignores DATABASE_URL and opens the wrong
      # SQLite file, so regenerate it explicitly from the current schema
      - name: Generate Prisma client
        env:
          DATABASE_URL: file:${{ github.workspace }}/ci.db
        run: npx prisma generate

      # The root layout queries the database while pages are being generated,
      # so the build needs a schema-shaped SQLite file to talk to
      - name: Prepare build-time database
        env:
          DATABASE_URL: file:${{ github.workspace }}/ci.db
        run: npx prisma migrate deploy

      - name: Build
        env:
          DATABASE_URL: file:${{ github.workspace }}/ci.db
        run: npm run build

      # Next traces a minimal node_modules into .next/standalone; static assets
      # and the Prisma engine have to be placed next to it by hand
      - name: Assemble deploy payload
        run: |
          rm -rf payload && mkdir -p payload
          cp -r .next/standalone/. payload/
          mkdir -p payload/.next
          cp -r .next/static payload/.next/static
          [ -d public ] && cp -r public payload/public
          cp -r prisma payload/prisma
          # Guarantee the query engine ships even if tracing misses it
          mkdir -p payload/node_modules/.prisma payload/node_modules/@prisma
          cp -r node_modules/.prisma/. payload/node_modules/.prisma/
          # `cp -r src dst` nests when dst already exists, and Next has usually
          # traced a partial copy there already, so copy the contents instead
          mkdir -p payload/node_modules/@prisma/client payload/node_modules/playwright-core
          cp -r node_modules/@prisma/client/. payload/node_modules/@prisma/client/
          # Kept external from the bundle, so it has to be copied in whole
          cp -r node_modules/playwright-core/. payload/node_modules/playwright-core/
          rm -f payload/prisma/dev.db payload/prisma/ci.db payload/ci.db
          # Next copies the repo .env into the bundle; it would shadow the
          # DATABASE_URL that systemd injects and silently use an empty database
          rm -f payload/.env payload/.env.*
          du -sh payload

      - name: Guard (needs SSH_PRIVATE_KEY, SERVER_HOST, SERVER_USER)
        id: guard
        env:
          HAS_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 Secret SSH_PRIVATE_KEY / SERVER_HOST / SERVER_USER，跳过部署。"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        if: steps.guard.outputs.go == '1'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync payload to staging
        if: steps.guard.outputs.go == '1'
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            payload/ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/staging/"

      - name: Migrate, swap in and restart
        if: steps.guard.outputs.go == '1'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/recode

          set -a; . /home/recode/app.env; set +a

          # Snapshot the live database before any migration touches it.
          # VACUUM INTO gives a consistent copy even while the app is serving;
          # any failure here stops the deploy before the data is changed.
          # Backups are never pruned automatically.
          mkdir -p /home/recode/backups
          BACKUP="/home/recode/backups/recode-$(date +%Y%m%d-%H%M%S).db"
          echo "VACUUM INTO '$BACKUP';" | node tools/node_modules/prisma/build/index.js \
            db execute --stdin --schema /home/recode/staging/prisma/schema.prisma
          test -s "$BACKUP"
          echo "database backed up to $BACKUP ($(du -h "$BACKUP" | cut -f1))"

          # Apply migrations before the new code starts serving
          node tools/node_modules/prisma/build/index.js migrate deploy \
            --schema /home/recode/staging/prisma/schema.prisma

          # Atomic swap, keeping the previous release for a quick rollback
          rm -rf app.prev
          [ -d app ] && mv app app.prev
          cp -a staging app

          sudo -n /usr/bin/systemctl restart recode
          REMOTE

      - name: Wait until healthy
        if: steps.guard.outputs.go == '1'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3200/login" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i}s (/login -> 200)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务在 60 秒内未就绪"
          systemctl status recode --no-pager -l | head -20 || true
          tail -40 /home/recode/logs/recode.err.log || true
          exit 1
          REMOTE

      # Public demo (DEMO_MODE=1, demo.recode.devwiles.online): the same build in
      # its own directory, database, port and systemd unit. It only holds
      # throwaway sandboxes, so it is migrated without a backup. Runs after the
      # real site is healthy, so a demo failure never holds the real site back.
      # Skipped until scripts/setup-demo-server.sh has been run on the server.
      - name: Deploy demo instance
        if: steps.guard.outputs.go == '1'
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no"
          if ! $SSH "$SERVER_USER@$SERVER_HOST" "test -f $DEPLOY_PATH/demo/demo.env"; then
            echo "::warning::服务器还没配置演示站（scripts/setup-demo-server.sh），跳过。"
            exit 0
          fi

          rsync -az --delete -e "$SSH" payload/ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/demo/staging/"

          $SSH "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/recode/demo

          set -a; . /home/recode/demo/demo.env; set +a

          node /home/recode/tools/node_modules/prisma/build/index.js migrate deploy \
            --schema /home/recode/demo/staging/prisma/schema.prisma

          rm -rf app.prev
          [ -d app ] && mv app app.prev
          cp -a staging app

          sudo -n /usr/bin/systemctl restart recode-demo

          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3201/login" || true)
            if [ "$code" = "200" ]; then
              echo "demo healthy after ${i}s (/login -> 200)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::演示站在 60 秒内未就绪"
          tail -40 /home/recode/demo/logs/demo.err.log || true
          exit 1
          REMOTE
